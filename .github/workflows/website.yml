name: website
on:
  push:
    branches: [main]
    paths: ['dashboard/**', 'scripts/build-site.py', 'scripts/check-site.py', 'reports/benchmark-10000.json', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-site.py .runtime/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .runtime/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Deploy interactive demo
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check-site.py "$SITE_URL"
